<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111512" media="(prefers-color-scheme: dark)">
<meta name="description" content="Batch-prep meal planner: 30 plants a week, oily fish, a fermented portion a day, 1,800 kcal.">
<title>Thirty Plants</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800&family=Permanent+Marker&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: one phone column (max 560px), sticky header, fixed tab bar. Detail sits one tap down.
   Dishes are line drawings tinted by each recipe's plant colours; prep labels are masking tape. */
:root {
  --bg: #F1F3EE;
  --surface: #FFFFFF;
  --surface-2: #E6EAE2;
  --ink: #1B211D;
  --muted: #5B655E;
  --line: #D3D9CE;
  --accent: #9A2B57;
  --accent-soft: #F3E1E8;
  --accent-ink: #FFFFFF;
  --leaf: #3C7A2C;
  --leaf-soft: #E1EEDA;
  --warn: #A9601A;
  --warn-soft: #F6E7D6;
  --tape: #EFE0A2;
  --tape-ink: #2C2717;
  --cream: #FBF6EA;
  --fishblue: #6E8FA8;
  --c-red: #D0453A;
  --c-orange: #E58A2C;
  --c-yellow: #E3BE2A;
  --c-green: #4A9A39;
  --c-purple: #6F3A90;
  --c-white: #CDBB98;
  --scrim: rgba(10, 14, 11, .45);
  --shadow: 0 10px 30px rgba(20, 30, 22, .14);
  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-label: "Permanent Marker", "Comic Sans MS", cursive;
  --r: 16px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111512; --surface: #191E1A; --surface-2: #232A25; --ink: #E5EAE3; --muted: #9AA59C; --line: #2E3631;
    --accent: #E57AA4; --accent-soft: #3A1D29; --accent-ink: #1E0E15; --leaf: #8BC870; --leaf-soft: #1F3019;
    --warn: #E6A866; --warn-soft: #36271A; --tape: #5B5233; --tape-ink: #F4ECCD; --cream: #38342B; --fishblue: #8FB2CC;
    --c-red: #E5675C; --c-orange: #EE9D4B; --c-yellow: #EBCB4B; --c-green: #6FB85D; --c-purple: #A276C2; --c-white: #B7A887;
    --scrim: rgba(0, 0, 0, .6); --shadow: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111512; --surface: #191E1A; --surface-2: #232A25; --ink: #E5EAE3; --muted: #9AA59C; --line: #2E3631;
  --accent: #E57AA4; --accent-soft: #3A1D29; --accent-ink: #1E0E15; --leaf: #8BC870; --leaf-soft: #1F3019;
  --warn: #E6A866; --warn-soft: #36271A; --tape: #5B5233; --tape-ink: #F4ECCD; --cream: #38342B; --fishblue: #8FB2CC;
  --c-red: #E5675C; --c-orange: #EE9D4B; --c-yellow: #EBCB4B; --c-green: #6FB85D; --c-purple: #A276C2; --c-white: #B7A887;
  --scrim: rgba(0, 0, 0, .6); --shadow: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(88px + env(safe-area-inset-bottom, 0px)); }
.art { display: block; flex: none; overflow: visible; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); margin-inline: -16px; padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 25px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand span { color: var(--leaf); }
.plantpill { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; background: var(--leaf-soft); color: var(--leaf); padding: 5px 10px 5px 6px; border-radius: 999px; border: 0; font-variant-numeric: tabular-nums; white-space: nowrap; }
.plantpill svg { width: 22px; height: 22px; }
.iconbtn { border: 0; background: transparent; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--ink); flex: none; }
.iconbtn:hover { background: var(--surface-2); }
.iconbtn svg { width: 22px; height: 22px; }
.iconbtn.wand { color: var(--accent); }

/* nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); }
.nav button { border: 0; background: none; padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .02em; position: relative; }
.nav button svg { width: 24px; height: 24px; transition: transform .25s var(--ease); }
.nav button[aria-current="page"] { color: var(--accent); }
.nav button[aria-current="page"] svg { transform: translateY(-2px); }
.nav button[aria-current="page"]::after { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }

/* type & bits */
h2.sec { font-family: var(--f-display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .03em; margin: 22px 0 8px; text-wrap: balance; }
.eyebrow { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.tape { font-family: var(--f-label); font-size: 11px; color: var(--tape-ink); background: var(--tape); padding: 1px 6px 0; transform: rotate(-1.5deg); display: inline-block; font-weight: 400; letter-spacing: .02em; text-transform: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: var(--surface-2); color: var(--ink); border: 1px solid transparent; }
.chip.good { background: var(--leaf-soft); color: var(--leaf); }
.chip.bad { background: var(--warn-soft); color: var(--warn); }
.chip svg { width: 14px; height: 14px; }
button.chip { cursor: pointer; }
.cdots { display: inline-flex; gap: 3px; vertical-align: middle; }
.cdots i { width: 9px; height: 9px; border-radius: 50%; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.c-red { background: var(--c-red) !important; box-shadow: none !important; }
.c-orange { background: var(--c-orange) !important; box-shadow: none !important; }
.c-yellow { background: var(--c-yellow) !important; box-shadow: none !important; }
.c-green { background: var(--c-green) !important; box-shadow: none !important; }
.c-purple { background: var(--c-purple) !important; box-shadow: none !important; }
.c-white { background: var(--c-white) !important; box-shadow: none !important; }
.bar { position: relative; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; transition: width .6s var(--ease); }
.bar .plan { background: var(--line); }
.bar .eat { background: var(--accent); }
.bar.leaf .eat { background: var(--leaf); }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; transition: transform .12s; }
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--warn); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 13.5px; }
.btn.link { border: 0; background: none; color: var(--accent); padding: 6px 2px; min-height: 36px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow .btn { flex: 1 1 auto; }

/* week nav + strip */
.weeknav { display: flex; align-items: center; gap: 4px; margin: 10px 0 6px; }
.weeknav .lbl { flex: 1; text-align: center; font-weight: 700; font-size: 14px; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.strip button { border: 1px solid transparent; background: var(--surface); border-radius: 12px; padding: 6px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; transition: background .2s, border-color .2s; }
.strip .dw { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.strip .dn { font-family: var(--f-display); font-size: 22px; font-weight: 800; line-height: 1; }
.strip .dots { display: flex; gap: 2px; height: 5px; }
.strip .dots i { width: 5px; height: 5px; border-radius: 50%; }
.strip button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.strip button.today .dn { color: var(--accent); }

/* today hero */
.hero { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-items: center; }
.ringwrap { position: relative; width: 132px; height: 132px; grid-row: span 1; }
.ringwrap svg { width: 132px; height: 132px; }
.ringfill { transition: stroke-dasharray .7s var(--ease); }
.ringtxt { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ringtxt b { font-family: var(--f-display); font-weight: 800; font-size: 36px; line-height: .9; font-variant-numeric: tabular-nums; }
.ringtxt span { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.ringtxt.over b { color: var(--warn); }
.heroside { display: grid; gap: 9px; min-width: 0; }
.minilbl { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
.minilbl b { color: var(--ink); font-variant-numeric: tabular-nums; }
.flags { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.flag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); }
.flag svg { width: 14px; height: 14px; }
.flag.good { background: var(--leaf-soft); color: var(--leaf); }
.flag.bad { background: var(--warn-soft); color: var(--warn); }
.targetbtn { justify-self: start; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.targetbtn svg { width: 13px; height: 13px; }
.morebtn { grid-column: 1 / -1; justify-self: center; border: 0; background: none; color: var(--muted); font-weight: 700; font-size: 13px; display: inline-flex; gap: 4px; align-items: center; padding: 6px 10px 0; }
.morebtn svg { width: 16px; height: 16px; transition: transform .25s var(--ease); }
.morebtn[aria-expanded="true"] svg { transform: rotate(180deg); }
.heromore { grid-column: 1 / -1; border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 10px; display: grid; gap: 8px; font-size: 13.5px; }
.heromore .row { display: flex; gap: 10px; justify-content: space-between; }
.heromore .row span:first-child { color: var(--muted); font-weight: 700; }
.heromore .row span:last-child { text-align: right; min-width: 0; }

/* meals */
.meals { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.meal { display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: center; border-top: 1px solid var(--line); min-height: 64px; }
.meal:first-child { border-top: 0; }
.tick { width: 44px; height: 100%; min-height: 64px; border: 0; background: none; display: grid; place-items: center; }
.tick span { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; background: var(--surface); transition: background .2s, border-color .2s; }
.tick span svg { width: 16px; height: 16px; opacity: 0; color: var(--accent-ink); transition: opacity .15s; }
.tick[aria-checked="true"] span { background: var(--accent); border-color: var(--accent); }
.tick[aria-checked="true"] span svg { opacity: 1; }
.tick:disabled { opacity: .35; cursor: default; }
.mealbody { border: 0; background: none; text-align: left; padding: 8px 12px 8px 0; min-width: 0; display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; }
.mtext { display: grid; gap: 1px; min-width: 0; }
.mtext .slot { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mtext .nm { font-weight: 700; font-size: 15px; line-height: 1.3; }
.kc { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; text-align: right; white-space: nowrap; }
.kc small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.meal.done .nm, .meal.done .kc { color: var(--muted); }
.meal.done .art { opacity: .5; }
.addslot { color: var(--accent); }
.extras { margin-top: 8px; display: grid; gap: 6px; }
.xrow { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 12px; }
.xrow .nm { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; }
.xrow .mt { font-size: 12px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.tile { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px; text-align: left; display: grid; gap: 2px; min-width: 0; }
.tile .v { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 15px; color: var(--muted); }
.tile .l { font-size: 11.5px; font-weight: 700; color: var(--muted); }
.tile.good .v { color: var(--leaf); }

/* week */
.wkactions { display: flex; gap: 8px; margin-top: 4px; }
.wkactions .primary { flex: 1; }
.wsum { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.wsum-top { display: flex; gap: 14px; align-items: center; }
.wsum-top .big { font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: .9; font-variant-numeric: tabular-nums; }
.wsum-top .big small { font-size: 20px; color: var(--muted); }
.wsum .minis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mini { background: var(--bg); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.mini b { font-family: var(--f-display); font-size: 22px; font-weight: 800; display: block; line-height: 1; font-variant-numeric: tabular-nums; }
.mini span { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.mini.good b { color: var(--leaf); }
.mini.bad b { color: var(--warn); }
.days { display: grid; gap: 8px; margin-top: 12px; }
.dayacc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.dayacc.today { border-color: var(--accent); }
.dayhead { width: 100%; border: 0; background: none; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto 20px; gap: 10px; align-items: center; padding: 10px 12px; text-align: left; }
.dayhead .d { font-family: var(--f-display); font-weight: 800; font-size: 20px; line-height: .95; text-transform: uppercase; }
.dayhead .d small { display: block; font-family: var(--f-body); font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.dayhead .pv { min-width: 0; font-size: 13.5px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.dayhead .pv .cdots { display: flex; margin-bottom: 3px; }
.dayhead .k { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.dayhead svg.chev { width: 18px; height: 18px; color: var(--muted); transition: transform .25s var(--ease); }
.dayacc.open .dayhead svg.chev { transform: rotate(90deg); }
.daybody { border-top: 1px solid var(--line); }
.drow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 12px; border: 0; border-top: 1px solid var(--line); background: none; width: 100%; text-align: left; }
.drow:first-child { border-top: 0; }
.drow .n { font-size: 14px; min-width: 0; line-height: 1.3; }
.drow .n small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.drow .n.empty { color: var(--accent); font-weight: 700; }
.drow .kc { font-size: 12.5px; color: var(--muted); }
.drow.done .n { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.plantgrid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 7px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; }
.pchip i { width: 9px; height: 9px; border-radius: 50%; background: var(--surface-2); }
.pchip.q { color: var(--muted); }
.pchip.eaten { border-color: var(--leaf); }
.pchip.on { background: var(--leaf-soft); border-color: var(--leaf); color: var(--leaf); font-weight: 700; }

/* prep */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; margin-top: 8px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 8px 6px; font-weight: 700; font-size: 13.5px; color: var(--muted); transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.callout { margin-top: 10px; background: var(--leaf-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 14px; display: flex; gap: 10px; }
.callout svg { width: 20px; height: 20px; flex: none; color: var(--leaf); margin-top: 1px; }
.callout.warn { background: var(--warn-soft); }
.callout.warn svg { color: var(--warn); }
.session { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.session > header { padding: 14px 14px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 3px; }
.session > header .d { font-family: var(--f-display); font-weight: 800; font-size: 26px; text-transform: uppercase; line-height: 1; }
.batch { padding: 12px 14px 14px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.batch:first-of-type { border-top: 0; }
.bhead { display: flex; gap: 12px; align-items: center; }
.bhead h3 { margin: 2px 0 0; font-size: 16px; line-height: 1.3; }
.labels { display: flex; flex-wrap: wrap; gap: 8px 6px; }
.label { font-family: var(--f-label); font-size: 13px; background: var(--tape); color: var(--tape-ink); padding: 3px 9px 2px; line-height: 1.25; }
.label:nth-child(odd) { transform: rotate(-1.2deg); }
.label:nth-child(even) { transform: rotate(1deg); }
.label.frz { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--c-white); }
.label.bad { background: var(--warn-soft); color: var(--warn); }
.ilist { list-style: none; margin: 0; padding: 0; display: grid; }
.ilist li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px dashed var(--line); font-size: 14px; }
.ilist li:first-child { border-top: 0; }
.ilist .q { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; text-align: right; }
details.more > summary { cursor: pointer; font-weight: 700; color: var(--accent); list-style: none; padding: 4px 0; display: inline-flex; align-items: center; gap: 4px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary svg { width: 16px; height: 16px; transition: transform .25s var(--ease); }

/* shop */

/* recipes */
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px; min-height: 46px; }
.rtools { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
.rtools .search { flex: 1; }
.filtbtn { position: relative; }
.filtbtn .dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.filters { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 2px; scrollbar-width: none; margin-inline: -16px; }
.filters::-webkit-scrollbar { display: none; }
.fchip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--muted); transition: background .2s, color .2s; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.rtile { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 10px 12px; text-align: left; display: grid; gap: 4px; align-content: start; min-width: 0; transition: transform .15s; }

/* sheets */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); overscroll-behavior: contain; }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 10px; }
.sheet h2 { font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1; text-transform: uppercase; margin: 0; text-wrap: balance; }

.sheet section { margin-top: 16px; }
.sheet h4 { margin: 0 0 6px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.nutri { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }

.field { display: grid; gap: 4px; margin-top: 10px; }

.check { display: flex; gap: 10px; align-items: center; margin-top: 12px; font-weight: 700; }

.plist { display: grid; gap: 6px; margin-top: 8px; }
.pick { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px 8px 8px; text-align: left; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; }
.pick .nm { font-weight: 700; display: block; }
.pick .mt { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pick .gain { color: var(--leaf); font-weight: 700; }
.pick.cur { border-color: var(--accent); background: var(--accent-soft); }
.menu { display: grid; gap: 6px; margin-top: 12px; }
.menu button { justify-content: flex-start; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 90; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.empty { text-align: center; padding: 26px 10px; color: var(--muted); display: grid; justify-items: center; gap: 10px; }
.empty p { margin: 0; }
hr.rule { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
.help { font-size: 14px; }
.help ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

/* set-up wizard */
.wz { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.wz-top { width: 100%; max-width: 560px; margin: 0 auto; padding: 10px 12px 6px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; }
.wz-prog { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.wz-prog i { height: 4px; border-radius: 4px; background: var(--line); transition: background .3s; }

.wz-body { flex: 1; overflow-y: auto; width: 100%; max-width: 560px; margin: 0 auto; padding: 4px 16px 20px; }
.wz-head { display: flex; gap: 12px; align-items: center; margin: 4px 0 10px; }

.wz-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.wz-foot { width: 100%; max-width: 560px; margin: 0 auto; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; border-top: 1px solid var(--line); background: var(--bg); }
.datechips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.opts { display: grid; gap: 8px; margin-top: 8px; }
.opt { border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; text-align: left; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 2px 10px; align-items: start; transition: border-color .2s, background .2s; }
.opt .rd { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); margin-top: 1px; display: grid; place-items: center; }

.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }

.carousel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 6px 11% 14px; margin-inline: -16px; scrollbar-width: none; overscroll-behavior-x: contain; }
.carousel::-webkit-scrollbar { display: none; }
.wcard { flex: 0 0 78%; scroll-snap-align: center; border: 2px solid var(--line); background: var(--surface); border-radius: 20px; padding: 14px 14px 16px; text-align: left; display: grid; gap: 6px; align-content: start; position: relative; transition: border-color .2s, transform .2s var(--ease), box-shadow .2s; min-width: 0; }
.wcard .wart { display: grid; place-items: center; background: var(--bg); border-radius: 14px; padding: 8px 0; margin-bottom: 4px; }
.wcard h3 { margin: 0; font-size: 18px; line-height: 1.25; text-wrap: balance; }
.wcard .mt { font-size: 13px; color: var(--muted); }
.wstats { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.wstats b { color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; }
.wcard .keep { font-size: 12.5px; color: var(--muted); }
.wcard .keep.bad { color: var(--warn); font-weight: 700; }
.wcheck { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; transition: background .2s, border-color .2s; }
.wcheck svg { width: 18px; height: 18px; color: var(--accent-ink); opacity: 0; }
.wcard.picked { border-color: var(--accent); box-shadow: 0 6px 18px rgba(154, 43, 87, .18); }
.wcard.picked .wcheck { background: var(--accent); border-color: var(--accent); }
.wcard.picked .wcheck svg { opacity: 1; }
.wcard .order { position: absolute; top: 14px; left: 14px; font-family: var(--f-label); background: var(--tape); color: var(--tape-ink); padding: 2px 8px 1px; font-size: 13px; transform: rotate(-3deg); }
.carnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: -4px; }
.carnav .pos { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.tray { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; min-height: 34px; }
.tray .chip { background: var(--accent-soft); color: var(--accent); padding-right: 4px; }
.tray .chip button { border: 0; background: none; color: inherit; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; }
.tray .chip button svg { width: 13px; height: 13px; }
.tray .hint { font-size: 13px; color: var(--muted); align-self: center; }
.review { display: grid; gap: 10px; margin-top: 6px; }
.rv { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.rv h4 { margin: 0; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.rv ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.rv li { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.rv li .art { flex: none; }

/* fx */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 95; overflow: hidden; }
.leafbit { position: absolute; width: 10px; height: 6px; border-radius: 10px 0 10px 0; }

@media (prefers-reduced-motion: no-preference) {
  .enter > * { animation: fadeUp .38s var(--ease) both; }
  .enter > *:nth-child(2) { animation-delay: .03s; } .enter > *:nth-child(3) { animation-delay: .06s; }
  .enter > *:nth-child(4) { animation-delay: .09s; } .enter > *:nth-child(5) { animation-delay: .12s; }
  .enter > *:nth-child(6) { animation-delay: .15s; } .enter > *:nth-child(n+7) { animation-delay: .18s; }
  .stagger > * { animation: fadeUp .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); }
  .scrim { animation: fade .2s ease-out; }
  .sheet { animation: rise .26s var(--ease); }
  .wz { animation: rise .3s var(--ease); }
  .wz-body.in-r { animation: slideR .3s var(--ease); }
  .wz-body.in-l { animation: slideL .3s var(--ease); }
  .tick.pop span { animation: pop .38s cubic-bezier(.3, 1.6, .5, 1); }
  .wcard.justpicked { animation: pop .34s cubic-bezier(.3, 1.6, .5, 1); }
  .daybody { animation: fadeUp .25s var(--ease); }
  .toast { animation: toastIn .3s var(--ease); }
  .steam { animation: steam 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
  .leafbit { animation: burst .75s cubic-bezier(.2, .7, .3, 1) forwards; }
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { transform: translateY(28px); opacity: .5; } to { transform: none; opacity: 1; } }
@keyframes slideR { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slideL { from { transform: translateX(-28px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes steam { 0%, 100% { opacity: .25; transform: translateY(2px); } 50% { opacity: .6; transform: translateY(-2px); } }
@keyframes burst { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); } }

@media (max-width: 400px) {

}

}

/* nights out */
.switch { width: 46px; height: 28px; border-radius: 999px; border: 0; padding: 0; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); position: relative; flex: none; transition: background .2s; }
.switch span { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .25s var(--ease); }
.switch[aria-checked="true"] { background: var(--accent); box-shadow: none; }
.switch[aria-checked="true"] span { transform: translateX(18px); }
.outlist { display: grid; gap: 8px; margin-top: 12px; }
.outrow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; min-height: 60px; transition: border-color .2s; }
.outrow.on { border-color: var(--accent); }
.outbody { border: 0; background: none; text-align: left; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 0; width: 100%; }
.outbody .d { font-family: var(--f-display); font-weight: 800; font-size: 20px; line-height: .95; text-transform: uppercase; }
.outbody .d small { display: block; font-family: var(--f-body); font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.outbody .sum { font-weight: 700; font-size: 14.5px; min-width: 0; line-height: 1.3; }
.outbody .sum small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.outbody .k { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; text-align: right; }
.outbody .k small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.drinks { display: grid; margin-top: 6px; }
.drink { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px dashed var(--line); }
.drink:first-child { border-top: 0; }
.drink .nm { font-size: 14px; }
.drink .nm small { display: block; color: var(--muted); font-size: 12px; }
.drink.has .nm { font-weight: 700; }
.stepper.sm button { width: 36px; height: 34px; }
.stepper.sm span { min-width: 34px; font-variant-numeric: tabular-nums; }
.drink.has .stepper { border-color: var(--accent); }
.totline { font-weight: 700; margin: 14px 0 10px; }
.wzouts { display: grid; gap: 8px; margin-top: 12px; }
.wzout { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; gap: 8px; transition: border-color .2s; }
.wzout.on { border-color: var(--accent); }
.wzout .top { display: flex; align-items: center; gap: 12px; }

@media (max-width: 400px) { .nav button { font-size: 10.5px; } .nav button svg { width: 22px; height: 22px; } }

</style>

  <header class="top">
    <h1 class="brand">Thirty <span>Plants</span></h1>
    <button class="plantpill" id="pill" data-a="tab" data-v="week" aria-label="Plants this week"></button>
    <button class="iconbtn wand" id="wandbtn" data-a="wizard" aria-label="Set up a week"></button>

<script>
/* Thirty Plants: ingredient, plant and recipe data.
   Nutrition is per 100g (dry weight for pasta, rice and grains; drained weight for tinned pulses).
   Recipes list grams for ONE portion. The app scales portions to each day's calorie budget. */

const PLANTS = {
  // fruit
  apple:['Apple',1,'red'], pear:['Pear',1,'green'], banana:['Banana',1,'yellow'], blueberry:['Blueberries',1,'purple'],

  lemon:['Lemon',1,'yellow'], lime:['Lime',1,'green'], pomegranate:['Pomegranate',1,'red'], peach:['Peach & nectarine',1,'orange'],
  apricot:['Apricots',1,'orange'], date:['Dates',1,'white'], grape:['Red grapes',1,'purple'], avocado:['Avocado',1,'green'],
  coconut:['Coconut',1,'white'], olive:['Olives',1,'purple'], tomato:['Tomato',1,'red'],
  // veg
  onion:['Onion',1,'white'], redonion:['Red onion',1,'purple'], springonion:['Spring onion',1,'green'], leek:['Leek',1,'green'],
  celery:['Celery',1,'green'], carrot:['Carrot',1,'orange'], redpepper:['Red pepper',1,'red'], yellowpepper:['Yellow pepper',1,'yellow'],
  greenpepper:['Green pepper',1,'green'], courgette:['Courgette',1,'green'], aubergine:['Aubergine',1,'purple'],
  mushroom:['Chestnut mushrooms',1,'white'], shiitake:['Shiitake',1,'white'], spinach:['Spinach',1,'green'],

function nightArt(o, size) {

/* ───────────── motion helpers ───────────── */
const reduced = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
const PREV = {};
function tw(key, to, start) { const from = key in PREV ? PREV[key] : start; PREV[key] = to; return from; }
function barI(cls, key, frac) { const to = pct(frac); return `<i class="${cls}" data-to="${to}" style="width:${tw(key, to, '0%')}"></i>`; }
function ringSvg(key, size, r, sw, eatF, planF, track, col) {
  const circ = 2 * Math.PI * r, d = f => `${(Math.min(1, Math.max(0, f)) * circ).toFixed(1)} ${circ.toFixed(1)}`;
  const toE = d(eatF), toP = d(planF), c = size / 2;
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${track}" stroke-width="${sw}"/>
    <circle class="ringfill" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}" stroke-linecap="round" transform="rotate(-90 ${c} ${c})" data-dash="${toP}" style="stroke-dasharray:${tw(key + 'p', toP, `0 ${circ.toFixed(1)}`)}"/>
    <circle class="ringfill" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" transform="rotate(-90 ${c} ${c})" data-dash="${toE}" opacity="${eatF > 0.003 ? 1 : 0}" style="stroke-dasharray:${tw(key + 'e', toE, `0 ${circ.toFixed(1)}`)}"/></svg>`;
}
function counter(key, to) { const from = tw(key, to, to); return `<b data-cnt="${to}" data-from="${from}">${fmtN(from)}</b>`; }
function animateIn(root) {
  const bars = root.querySelectorAll('[data-to]'), rings = root.querySelectorAll('[data-dash]'), cnts = root.querySelectorAll('[data-cnt]');
  const finish = () => { bars.forEach(el => { el.style.width = el.dataset.to; }); rings.forEach(el => { el.style.strokeDasharray = el.dataset.dash; }); cnts.forEach(el => { el.textContent = fmtN(+el.dataset.cnt); }); };
  if (reduced()) { finish(); return; }
  requestAnimationFrame(() => requestAnimationFrame(() => { bars.forEach(el => { el.style.width = el.dataset.to; }); rings.forEach(el => { el.style.strokeDasharray = el.dataset.dash; }); }));
  cnts.forEach(el => {
    const a = +el.dataset.from, b = +el.dataset.cnt; if (a === b) return;
    const t0 = performance.now();
    const step = t => { const p = Math.min(1, (t - t0) / 550), e = 1 - Math.pow(1 - p, 3); el.textContent = fmtN(a + (b - a) * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function burst(el) {
  if (reduced() || !el) return;
  const r = el.getBoundingClientRect(), fx = $('fx'), cols = ['green', 'yellow', 'red', 'orange', 'purple', 'green'];
  for (let i = 0; i < 9; i++) {
    const s = document.createElement('i'), a = (i / 9) * Math.PI * 2 + Math.random() * 0.6, d = 24 + Math.random() * 24;
    s.className = 'leafbit';
    s.style.cssText = `left:${r.left + r.width / 2 - 5}px;top:${r.top + r.height / 2 - 3}px;background:var(--c-${cols[i % cols.length]});--dx:${Math.round(Math.cos(a) * d)}px;--dy:${Math.round(Math.sin(a) * d)}px;--rot:${Math.round(Math.random() * 360)}deg`;
    fx.appendChild(s); setTimeout(() => s.remove(), 800);
  }
}

}

}

function vToday() {

function prepGroups(se) {
  const groups = [];
  for (const s of ['l', 'b']) {
    const map = new Map();
    for (const k of sessDays(se, s)) {
      const o = dayCalc(k).slots[s];
      if (o.kind !== 'recipe' || !o.prepped || o.done) continue;
      if (!map.has(o.r.id)) map.set(o.r.id, { r: o.r, s, entries: [] });
      const off = daysBetween(se.date, k);

}

const AISLES = [['veg', 'Fruit, veg & herbs'], ['meat', 'Meat'], ['fish', 'Fish'], ['dairy', 'Dairy & eggs'], ['chilled', 'Chilled'], ['bakery', 'Bakery'], ['frozen', 'Frozen'], ['dry', 'Pasta, rice & grains'], ['tins', 'Tins & jars'], ['world', 'World foods'], ['nuts', 'Nuts, seeds & dried fruit'], ['baking', 'Baking'], ['drinks', 'Drinks'], ['oils', 'Oils & sauces'], ['spices', 'Herbs & spices']];
function shopTotals(st, trip) {

  for (const k of weekDays(st)) {
    const c = dayCalc(k), di = daysBetween(st, k);
    for (const s of SLOTS) {
      const o = c.slots[s];
      if (o.kind !== 'recipe' || o.done) continue;
      const t = mode === 'two' ? (o.prepped ? (sessDays(sess[1], s).includes(k) ? 2 : 1) : (di <= 2 ? 1 : 2)) : 1;

  }

}

const RTAGS = [['fav', 'Favourites'], ['onepot', 'One pot'], ['pasta', 'Pasta'], ['noodles', 'Noodles'], ['rice', 'Rice'], ['tray', 'Traybake'], ['oily', 'Oily fish'], ['veggie', 'Veggie'], ['freezes', 'Freezes'], ['ferm', 'Fermented'], ['quick', 'Quick'], ['soup', 'Soup'], ['curry', 'Curry'], ['red', 'Red meat']];
function tagMatch(r, t) {
  if (!t) return true;
  if (t === 'fav') return !!S.favs[r.id];
  if (t === 'oily') return r.oily; if (t === 'veggie') return r.veg; if (t === 'freezes') return r.fz; if (t === 'ferm') return r.fermBase; if (t === 'red') return r.red;
  if (t === 'rice') return r.rice || r.tags.includes('rice');
  if (t === 'quick') return r.tags.includes('quick') || r.t <= 20;
  if (t === 'batch') return r.mk >= 3 || r.prep;
  if (t === 'egg') return r.items.some(it => it.i === 'egg');
  if (t === 'choc') return r.items.some(it => it.i === 'cocoa' || it.i === 'darkchoc');
  if (t === 'protein') return r.p >= 10;
  return r.tags.includes(t);
}

    keepNightFields(); const k = SH.k, day = D(k), was = outOf(day);
    day.out = Object.assign({}, SH.o, { on: true, done: was ? !!was.done : false });
    const moved = applyOut(k); planWeek(startOf(k), false);
    closeSheet(); render(); toast(moved ? `Saved. Oily fish moved to ${fmtDay(moved)}` : 'Night out saved');
  },
  nightoff() { const k = SH.k; delete D(k).out; applyOut(k); planWeek(startOf(k), false); closeSheet(); render(); toast(`Staying in on ${fmtDay(k)}`); },
  outmode(d) { S.set.drinkMode = d.v; save(); render(); },
  open(d) { openSheet({ type: 'recipe', r: d.r, k: d.k, s: d.s, n: 1 }); },
  pick(d) { openSheet({ type: 'pick', k: d.k, s: d.s, q: '' }); },
  bswap(d) { openSheet({ type: 'pick', st: UI.week, bkey: d.key, s: d.s, q: '' }); },
  pkall(d, el) { SH.all = el.checked; },
  choose(d) {
    if (SH.bkey) { applyBatch(SH.st, SH.bkey, SH.s, d.r); toast('Batch updated'); }
    else { const bc = batchContext(SH.k, SH.s); if (SH.all && bc && prepped(SH.k, SH.s, R[d.r])) { applyBatch(bc.st, bc.se.key, SH.s, d.r); toast('Batch updated'); } else setSlot(SH.k, SH.s, d.r); }
    closeSheet(); render();
  },
  custom(d) { openSheet({ type: 'custom', k: d.k, s: d.s }); },
  csave() {
    const n = $('c-n').value.trim() || 'Something else', k = +$('c-k').value || 0, p = +$('c-p').value || 0, day = D(SH.k), was = day.done[SH.s];
    day.sl[SH.s] = '@c'; day.cu[SH.s] = { n, k, p }; if (!was || !was.c) delete day.done[SH.s];
    save(); closeSheet(); render();
  },
  skip(d) { setSlot(d.k, d.s, '@skip'); closeSheet(); render(); },
  clearslot(d) { const day = D(d.k); delete day.sl[d.s]; delete day.cu[d.s]; delete day.done[d.s]; save(); closeSheet(); render(); },
  fav() { if (S.favs[SH.r]) delete S.favs[SH.r]; else S.favs[SH.r] = 1; save(); renderSheet(); render(); },
  serv(d) { SH.n = Math.max(1, Math.min(12, (SH.n || 1) + +d.v)); renderSheet(); },
  addplan() { const k = $('ap-day').value, s = $('ap-slot').value; setSlot(k, s, SH.r); UI.day = k; closeSheet(); toast(`Added to ${fmtDay(k)}`); render(); },
  xadd() { openSheet({ type: 'xadd', pl: [] }); },
  xpl(d) { keepAddFields(); const i = SH.pl.indexOf(d.v); if (i >= 0) SH.pl.splice(i, 1); else SH.pl.push(d.v); renderSheet(); },
  xsave() { keepAddFields(); if (!SH.n && !SH.k) { toast('Add a name or calories'); return; } D(UI.day).x.push({ n: SH.n || 'Extra', k: +SH.k || 0, p: +SH.p || 0, fe: !!SH.fe, pl: SH.pl.slice() }); save(); closeSheet(); render(); },
  xdel(d) { D(UI.day).x.splice(+d.i, 1); save(); render(); },
  target() { openSheet({ type: 'target' }); },
  tpreset(d) { $('t-v').value = d.v; },
  tsave() { const v = Math.round(+$('t-v').value); if (v < 800 || v > 6000) { toast('Pick something between 800 and 6,000'); return; } D(UI.day).t = v === S.set.target ? null : v; save(); closeSheet(); render(); },
  treset() { D(UI.day).t = null; save(); closeSheet(); render(); },
  fill() { closeSheet(); const st = UI.tab === 'today' ? startOf(UI.day) : UI.week; planWeek(st, false); UI.anim = 'built'; toast('Week planned'); render(); },
  replan() { const st = UI.week; ask('Re-plan this week?', 'Every meal you haven\'t ticked off or set yourself will be replaced with a fresh plan.', 'Re-plan', () => { planWeek(st, true); UI.anim = 'built'; toast('New plan ready'); }); },
  weekmenu() { openSheet({ type: 'weekmenu' }); },
  mode(d) { W(UI.week).mode = d.v; save(); render(); },
  trip(d) { UI.trip = +d.v; render(); },
  shopck(d) { const w = W(UI.week), key = `${weekMode(UI.week) === 'two' ? UI.trip : 0}:${d.i}`; if (w.shop[key]) delete w.shop[key]; else w.shop[key] = 1; save(); render(); },
  untick() { W(UI.week).shop = {}; save(); render(); },
  copyshop() {
    const st = UI.week, mode = weekMode(st), trip = mode === 'two' ? UI.trip : 0, tot = shopTotals(st, trip), w = W(st);
    const lines = [`Thirty Plants · shopping for ${fmtRange(st)}`];
    AISLES.forEach(([a, name]) => { const its = Object.keys(tot).filter(i => ING[i].a === a && !ING[i].pantry && !w.shop[`${trip}:${i}`]); if (!its.length) return; lines.push('', name.toUpperCase()); its.forEach(i => lines.push(`- ${ING[i].n}: ${fmtQ(i, tot[i], true)}`)); });
    copyText(lines.join('\n'));
  },
  rslot(d) { UI.rslot = d.v; render(); },
  rtag(d) { UI.rtag = UI.rtag === d.v ? '' : d.v; render(); },
  rfilt() { UI.rfilt = !UI.rfilt; render(); },
  settings() { openSheet({ type: 'settings' }); },
  setsave() {
    const g = id => +$(id).value, st = S.set, pos = (v, f) => isFinite(v) && v > 0 ? v : f;
    st.target = pos(g('s-target'), st.target); st.protGoal = pos(g('s-prot'), st.protGoal);
    st.latteOn = $('s-latte').checked; st.latteK = pos(g('s-lk'), st.latteK); st.latteP = Math.max(0, g('s-lp') || 0); st.latteMl = pos(g('s-lml'), st.latteMl);
    st.bud = { b: pos(g('s-bb'), st.bud.b), l: pos(g('s-bl'), st.bud.l), s: Math.max(1, g('s-bs') || 0), d: pos(g('s-bd'), st.bud.d), p: Math.max(1, g('s-bp') || 0) };
    st.plantGoal = pos(g('s-plants'), st.plantGoal); st.colourGoal = Math.min(6, pos(g('s-col'), st.colourGoal)); st.oilyGoal = Math.max(0, g('s-oily') || 0); st.redMax = Math.max(0, g('s-red') || 0);
    st.weekStart = +$('s-ws').value || 0; st.weekendBatch = $('s-wkb').checked; st.adapt = $('s-adapt').checked;
    st.usualDrink = $('s-usual').value; st.drinkMode = $('s-dm').value; st.dinnerOutK = pos(g('s-dok'), st.dinnerOutK);
    UI.week = startOf(UI.day);
    save(); closeSheet(); toast('Settings saved'); render();
  },
  backup(d) { openSheet({ type: 'backup', mode: d.v }); },
  bkcopy() { copyText($('bk').value, $('bk')); },
  bkdl() {
    try { const blob = new Blob([JSON.stringify(S)], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `thirty-plants-backup-${todayKey()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
    catch (e) { toast('Download not available here; use Copy'); }
  },
  bkimport() {
    const f = $('bk-file').files && $('bk-file').files[0];
    const finish = txt => { let s; try { s = JSON.parse(txt); } catch (e) { toast("That isn't a valid backup"); return; } if (!s || s.v !== 1 || !s.days) { toast("That isn't a Thirty Plants backup"); return; } S = normalise(s); UI.week = startOf(UI.day); save(); closeSheet(); toast('Backup restored'); render(); };
    if (f) { const rd = new FileReader(); rd.onload = () => finish(rd.result); rd.readAsText(f); } else finish($('bk').value);
  },
  resetall() { ask('Clear all data?', 'Plans, ticks, favourites and settings on this device will be deleted. Export a backup first if you might want them.', 'Clear everything', () => { S = normalise(null); save(); UI.day = todayKey(); UI.week = startOf(UI.day); planWeek(UI.week, false); toast('Started fresh'); }, true); },
  confirmyes() { const fn = pending; closeSheet(); if (fn) fn(); render(); },
  close() { closeSheet(); },
  // wizard
  wizard() { openWizard(); },
  wzclose() { closeWizard(); },
  wzdate(d) { WZ.start = d.v; renderWZ(); },
  wzmode(d) { WZ.mode = d.v; ['b', 'l'].forEach(s => { WZ.picks[s] = WZ.picks[s].slice(0, wzMax(s)); }); renderWZ(); },
  wzwkb(d, el) { WZ.wkb = el.checked; },
  wzout(d) { wzOutInit(); if (WZ.out[d.v]) delete WZ.out[d.v]; else WZ.out[d.v] = { lvl: 'usual', din: false }; wzTrimD(); renderWZ(); },
  wzoutlvl(d) { WZ.out[d.k].lvl = d.v; renderWZ(); },
  wzoutdin(d, el) { WZ.out[d.v].din = el.checked; wzTrimD(); renderWZ(); },
  wzfilt(d) { WZ.f[WZSTEPS[WZ.step]] = d.v; renderWZ(); },
  wzscroll(d) { const car = $('wz-car'), c = car && car.querySelector('.wcard'); if (c) car.scrollBy({ left: +d.v * (c.offsetWidth + 12), behavior: reduced() ? 'auto' : 'smooth' }); },
  wzpick(d) {
    const s = WZSTEPS[WZ.step], picks = WZ.picks[s], max = wzMax(s), i = picks.indexOf(d.r);
    if (i >= 0) picks.splice(i, 1);
    else if (picks.length < max) picks.push(d.r);
    else if (max <= 2) { picks[max - 1] = d.r; if (max === 2) toast('Two at most, so that replaced your second pick'); }
    else { toast(`That's ${max}. Remove one first`); return; }
    wzPatch(s, d.r);
  },
  wzunpick(d) { const p = WZ.picks[d.s], i = p.indexOf(d.r); if (i >= 0) p.splice(i, 1); wzPatch(d.s); },
  wznext() { if (WZ.step === WZSTEPS.length - 1) { wzBuild(); return; } WZ.step++; WZ.dir = 1; WZ.anim = true; renderWZ(); $('wz-body').scrollTop = 0; },
  wzback() { if (WZ.step === 0) return; WZ.step--; WZ.dir = -1; WZ.anim = true; renderWZ(); }
};
function keepNightFields() { if (!SH || SH.type !== 'night') return; SH.o.note = $('n-note').value.trim(); if ($('n-dk')) SH.o.dinnerK = +$('n-dk').value || SH.o.dinnerK; SH.o.skipPud = $('n-skp').checked; }
function keepAddFields() { if (!SH || SH.type !== 'xadd') return; SH.n = $('x-n').value.trim(); SH.k = $('x-k').value; SH.p = $('x-p').value; SH.fe = $('x-fe').checked; SH.plq = $('plq').value; }

document.addEventListener('click', e => {
  if (e.target.dataset && e.target.dataset.scrim) { closeSheet(); return; }
  const t = e.target.closest('[data-a]');
  if (!t || t.disabled) return;
  const fn = ACT[t.dataset.a];
  if (fn) fn(t.dataset, t, e);
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'rq') { UI.rq = e.target.value; $('rlist').innerHTML = rListHtml(); }
  else if ((id === 'pq' || id === 'plq') && SH) {
    if (id === 'pq') SH.q = e.target.value; else keepAddFields();
    const pos = e.target.selectionStart; renderSheet(); const el = $(id); el.focus(); try { el.setSelectionRange(pos, pos); } catch (er) { /* ignore */ }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'wz-date' && WZ && e.target.value) { WZ.start = e.target.value; renderWZ(); }
  if (e.target.id === 'wz-usual' && WZ) { WZ.usual = e.target.value; renderWZ(); }
});
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (SH) closeSheet(); else if (WZ) closeWizard(); });

/* ───────────── shell ───────────── */
const TABS = [['today', 'Today', 'today'], ['week', 'Week', 'week'], ['out', 'Out', 'glass'], ['prep', 'Prep', 'prep'], ['shop', 'Shop', 'shop'], ['recipes', 'Recipes', 'book']];
function render() {
  const st = UI.tab === 'today' ? startOf(UI.day) : UI.week, wc = weekCalc(st), g = S.set.plantGoal;
  $('pill').innerHTML = `<span style="width:22px;height:22px;display:inline-block">${ringSvg('pill', 22, 8, 3, wc.ptsEat / g, wc.ptsPlan / g, 'var(--leaf-soft)', 'currentColor')}</span><span>${fmtPts(wc.ptsPlan)}/${g}</span>`;
  $('pill').setAttribute('aria-label', `${fmtPts(wc.ptsPlan)} of ${g} plant points planned this week`);
  $('gear').innerHTML = ic('gear'); $('wandbtn').innerHTML = ic('wand');
  $('nav').innerHTML = TABS.map(([v, l, i]) => `<button data-a="tab" data-v="${v}" ${UI.tab === v ? 'aria-current="page"' : ''}>${ic(i)}<span>${l}</span></button>`).join('');
  const main = $('main');
  main.innerHTML = ({ today: vToday, week: vWeek, out: vOut, prep: vPrep, shop: vShop, recipes: vRecipes }[UI.tab] || vToday)();
  main.classList.remove('enter');
  if (UI.anim === 'enter') { void main.offsetWidth; main.classList.add('enter'); }
  animateIn(document);
  if (UI.pop) { const t = document.querySelector(`.tick[data-s="${UI.pop}"]`); if (t) { t.classList.add('pop'); if (t.getAttribute('aria-checked') === 'true') burst(t); } UI.pop = null; }
  UI.anim = null;
}

(function init() {
  const st = startOf(todayKey());
  if (!weekDays(st).some(k => S.days[k] && Object.keys(S.days[k].sl || {}).length)) planWeek(st, false);
  render();
})();

window.ThirtyPlants = { R, ING, dayCalc, weekCalc, planWeek, suggestMode, shopTotals, sessions, state: () => S, art };
})();

</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {

}
