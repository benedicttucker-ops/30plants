.rvc.sl.y { background: var(--bg); border: 1px solid var(--line); color: var(--ink); }
.rvc.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.rvsl { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; background: var(--bg); border-radius: 12px; padding: 8px 10px; margin-top: 4px; }
.rvxs { display: grid; }
.rvx { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; border-top: 1px solid var(--line); }
.rvx:first-child { border-top: 0; }
.rvx > span { min-width: 0; font-size: 14px; }
.rvx > span b { margin-right: 6px; }
.rvx small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
.rvnum { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 8px 12px; min-height: 48px; font-family: var(--f-display); font-weight: 800; font-size: 22px; }
.rvnum::placeholder { font-family: var(--f-body, inherit); font-weight: 400; font-size: 15px; color: var(--muted); }
.seg.rvseg { margin: 0; }
.rvsum { gap: 0; }
.rvsum .eyebrow { margin-bottom: 4px; }
.rvsr { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1.25fr); align-items: center; gap: 10px; min-height: 40px; padding: 6px 0; font-size: 14px; border-top: 1px solid var(--line); }
.rvsum .eyebrow + .rvsr { border-top: 0; }
.rvsr > span { font-weight: 700; }
.rvsr b { text-align: right; font-size: 13.5px; font-weight: 600; }
.rvban { grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-color: var(--accent); }
.rvban > div { display: grid; gap: 2px; }
.rhead .rvbtn { margin-left: auto; }
.rv .wz-foot .btn.primary svg { width: 16px; height: 16px; }
.rvc.pl { border: 0; font-size: 10.5px; font-weight: 700; color: var(--muted); opacity: .7; }
.gapcard { gap: 10px; }
.gaplist { display: grid; }
.gaprow { display: flex; align-items: center; gap: 4px; border-top: 1px solid var(--line); min-height: 56px; }
.gaplist .gaprow:first-child { border-top: 0; }
.gapopen { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 0; background: none; color: var(--ink); text-align: left; padding: 8px 0; }
.gapopen > span, .gaprow.aside > span { display: grid; gap: 2px; min-width: 0; flex: 1; }
.gapopen b, .gaprow.aside b { font-size: 14.5px; }
.gaprow small { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.gapopen svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.gaprow .iconbtn svg { width: 18px; height: 18px; color: var(--muted); }
.gaprow.aside { padding: 6px 0; }
.gaplink { justify-self: start; padding-left: 0; }
.rvnr { display: flex; align-items: center; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 2px; }
.rvnr .small { flex: 1 1 160px; }
.rvnrc .rvnr { border-top: 0; padding-top: 0; margin-top: 0; }
/* calories on ingredient lines */
.ilist.ik li { align-items: flex-start; }
.ilist.ik .in { min-width: 0; text-align: left; }
.ilist.ik .in small, .ilist.ik .q small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 1px; }
.ilist.ik .q small { font-variant-numeric: tabular-nums; }
.ilist.ik .for { font-size: 12.5px; }
.ilist.ik .itot { border-top: 1px solid var(--line); font-weight: 800; padding-top: 8px; margin-top: 2px; }
/* swaps on method steps and prep screens */
.swapin { display: flex; gap: 6px; align-items: flex-start; margin: 4px 0 0; font-size: 13px; font-weight: 700; color: var(--accent); }
.swapin svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }
/* checking ingredients against your packs */
.ichip { display: inline-flex; align-items: center; gap: 3px; margin-left: 8px; padding: 1px 8px; min-height: 24px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 11.5px; font-weight: 800; vertical-align: middle; }
.ichip svg { width: 12px; height: 12px; }
.ichip.ok { border-color: var(--leaf); background: var(--leaf-soft); color: var(--leaf); }
.ichip.own { border-color: var(--accent); color: var(--accent); }
.ichip[aria-expanded="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.ichip.out { border-color: var(--warn); color: var(--warn); min-height: 30px; padding: 2px 10px; }
.ichip.sw { border-color: var(--accent); color: var(--accent); min-height: 30px; padding: 2px 10px; }
.ichip.sw[aria-expanded="true"] { background: var(--accent-soft); outline: none; }
.ilist.ik .ipanel.mswap .chips { margin: 0; }
.ilist.ik .ipanel.mswap .eyebrow { margin: 0; }
.ilist.ik .ipanel.mswap b { font-weight: 800; }
.omline { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.omline .btn { flex: none; }
.callout.omit .btnrow { margin-top: 6px; }
.ilist.ik .ipanel { display: grid; gap: 8px; padding: 10px; margin: 0 0 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
.ipf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ipf label { display: grid; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted); }
.ipf input { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 8px; min-height: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ipanel .btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
.nconf { display: flex; align-items: center; justify-content: space-between; gap: 8px 10px; flex-wrap: wrap; margin-top: 8px; padding: 9px 11px; border-radius: 12px; background: var(--bg); font-size: 13.5px; }
.nconf span { flex: 1 1 180px; }
.nconf.ok { background: var(--leaf-soft); color: var(--ink); justify-content: flex-start; flex-wrap: nowrap; }
.nconf.ok svg { width: 18px; height: 18px; color: var(--leaf); flex: none; }
.ilist.ik { grid-template-columns: minmax(0, 1fr); }
.ipf label { min-width: 0; }
.ipf input { box-sizing: border-box; max-width: 100%; }
.ilist.ik .ipanel { grid-template-columns: minmax(0, 1fr); }
.ilist.ik .ipanel { white-space: normal; }
.ilist.ik .in { font-weight: 700; } .ilist.ik .in small { font-weight: 600; } .ilist.ik .for { font-weight: 600; }
.wzsp { gap: 6px; }
.wzsp .chip.selc { padding: 4px 10px 4px 7px; font-size: 12.5px; min-height: 32px; }
/* week review: meals day by day */
.rvtabs { margin-top: 10px; }
.rvtab { display: grid; justify-items: center; gap: 1px; padding: 6px 0 5px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-height: 58px; }
.rvtab small { font-size: 11px; font-weight: 800; color: var(--muted); }
.rvtab b { font-size: 15px; font-variant-numeric: tabular-nums; }
.rvtab i { font-style: normal; font-size: 11px; font-weight: 800; color: var(--st-off); min-height: 13px; }
.rvtab.on { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.rvtab.on small, .rvtab.on i { color: var(--accent-ink); }
.rvdh { display: grid; gap: 2px; }
.rvdh b { font-size: 16px; }
.rvmls { display: grid; gap: 6px; }
.rvml { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 10px; min-height: 52px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); text-align: left; }
.rvml .box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--leaf); background: var(--leaf); color: #fff; display: grid; place-items: center; }
.rvml .box svg { width: 15px; height: 15px; }
.rvml .mt { display: grid; gap: 1px; min-width: 0; }
.rvml .mt small { font-size: 10.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.rvml .mt b { font-size: 14px; font-weight: 700; }
.rvml .kc { font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.rvml.off { border-style: dashed; background: none; }
.rvml.off .box { background: none; border-color: var(--line); color: transparent; }
.rvml.off .mt b { text-decoration: line-through; color: var(--muted); }
.rvml.skip { opacity: .6; border-style: dashed; background: none; }
.rvml.skip .box { background: none; border-color: var(--line); }
.swapdays { margin-top: 10px; }
.pick.sd { grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; }
.pick.sd > svg { width: 18px; height: 18px; color: var(--accent); }
/* amount in one portion, in the ingredient check */
.ipf.ipa { grid-template-columns: minmax(0, 1fr); }
.ipf.ipa input { max-width: 160px; }
/* long words in headings break rather than push the screen sideways; big sheet titles shrink to fit instead (fitTitles) */
h1, h2, h3 { overflow-wrap: anywhere; }
.sheet h2 { overflow-wrap: normal; }
.sheet h2.squeeze { overflow-wrap: anywhere; }
/* backup line and nudge */
.bkline { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
.bkline svg { width: 16px; height: 16px; flex: none; }
.bkline.due { color: var(--ink); }
.rvbk .btn { margin-top: 2px; }
.bknudge .btnrow { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
/* trends: the story summary, jump chips, now-against-usual bars, extras folded at the bottom */
:root { --zone: color-mix(in srgb, var(--leaf) 36%, var(--surface)); }
.trstory { display: grid; gap: 8px; }
.trstory p { margin: 0; font-size: 15px; line-height: 1.5; }
.trstory p:first-child { font-weight: 700; }
.trgrp h3 .muted { font-weight: 400; font-size: 14px; }
.tchips { display: flex; flex-wrap: wrap; gap: 6px; }
.tchip { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
.tchip.t-off { background: color-mix(in srgb, var(--st-off) 12%, var(--surface)); border-color: color-mix(in srgb, var(--st-off) 40%, var(--surface)); }
.tchip.t-mid { background: color-mix(in srgb, var(--st-mid) 16%, var(--surface)); border-color: color-mix(in srgb, var(--st-mid) 50%, var(--surface)); }
.trlegend { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 12px; margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--line) 55%, var(--bg)); font-size: 12.5px; }
.trlegend span { display: inline-flex; align-items: center; gap: 6px; }
.trlegend i { display: inline-block; flex: none; }
.lg-n { width: 22px; height: 5px; border-radius: 3px; background: var(--ink); }
.lg-u { width: 10px; height: 10px; margin: 0 2px; transform: rotate(45deg); border: 2px solid var(--ink); background: var(--surface); box-sizing: border-box; }
.lg-z { width: 22px; height: 10px; border-radius: 3px; background: var(--zone); }
.trlist { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.trlist .trrow { border: 0; border-radius: 0; background: none; }
.trlist > * + * { border-top: 1px solid var(--line); }
.trhead { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 12px 12px 11px 14px; }
.trtop { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 18px; gap: 10px; align-items: center; }
.trtop .trv b { font-family: var(--f-display); font-size: 24px; font-weight: 800; line-height: 1; }
.trtop .trv small { display: block; white-space: normal; max-width: 128px; margin-left: auto; line-height: 1.25; }
.bul { position: relative; display: block; height: 14px; margin: 2px 0 0 20px; }
.bul::before { content: ''; position: absolute; left: 0; right: 0; top: 3px; height: 8px; border-radius: 4px; background: var(--bg); }
.bul i { position: absolute; display: block; }
.bul .bz { top: 3px; height: 8px; border-radius: 4px; background: var(--zone); }
.bul .bn { left: 0; top: 5px; height: 4px; border-radius: 2px; background: var(--ink); }
.bul .bu { top: 2px; width: 10px; height: 10px; margin-left: -5px; transform: rotate(45deg); box-sizing: border-box; border: 2px solid var(--ink); background: var(--surface); }
.trfoot { display: block; margin-left: 20px; font-size: 12.5px; line-height: 1.35; color: var(--muted); }
.alsohead { width: 100%; min-height: 60px; display: grid; grid-template-columns: minmax(0, 1fr) auto 18px; gap: 10px; align-items: center; padding: 11px 12px 11px 14px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.alsohead svg.chev { width: 18px; height: 18px; color: var(--muted); transition: transform .25s var(--ease); }
.also.open .alsohead svg.chev { transform: rotate(90deg); }
.abadge { min-width: 26px; height: 26px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.alsobody { display: grid; gap: 10px; padding: 0 12px 14px 14px; }
.seg.trwin { margin-top: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-flow: row; }
.seg.trwin button { min-height: 44px; padding: 6px 4px; font-size: 14px; line-height: 1.15; }
/* amounts beside the method step that first names each ingredient */
.stepamt { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 2px; }
.samt { display: inline-block; padding: 3px 8px; border-radius: 8px; background: var(--surface-2); color: var(--ink); font-size: 13px; font-weight: 400; line-height: 1.35; }
.samt b { font-weight: 700; margin-right: 3px; }
/* saved foods */
.foodbox { margin-top: 10px; }
.foodlist { display: grid; gap: 6px; margin-top: 8px; }
.frow { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 2px 4px 2px 0; }
.frow .nm { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 8px 12px; color: var(--ink); font: inherit; font-weight: 700; display: grid; gap: 2px; cursor: pointer; }
.frow .nm .mt { font-weight: 400; font-size: 12.5px; color: var(--muted); }
/* leftovers you can correct */
button.link { border: 0; background: none; padding: 0; font: inherit; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.lrow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.lrow:last-child { border-bottom: 0; }
.lrow .n { flex: 1; min-width: 0; font-weight: 700; display: block; overflow-wrap: anywhere; }
.lrow .n .h { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
.lrow .n .ichip { margin: 4px 0 0; }
.lrow .lbtns { display: flex; align-items: center; gap: 2px; flex: none; }
.lrow .lbtns .iconbtn { font-size: 20px; font-weight: 700; }
.crow .n .ichip { margin-left: 6px; }

/* the ⓘ by a recipe's name, and the description it opens */
.glue { white-space: nowrap; }
.glue.loose { white-space: normal; }
.infodot { display: inline-grid; place-items: center; width: 30px; height: 30px; margin: -4px -4px -4px 4px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--muted); vertical-align: middle; cursor: pointer; }
.infodot svg { width: 22px; height: 22px; }
.infodot:hover { color: var(--ink); background: var(--surface-2); }
.infodot[aria-expanded="true"] { color: var(--accent-ink); background: var(--accent); }
.pghead .infodot { width: 28px; height: 28px; margin-left: 2px; }
.pghead .infodot svg { width: 19px; height: 19px; }
.rdesc { margin-top: 12px; padding: 11px 14px 12px; border-radius: 14px; background: var(--surface-2); border-left: 4px solid var(--accent); }
.rdesc[hidden] { display: none; }
.rdesc p { margin: 4px 0 0; font-size: 15.5px; line-height: 1.45; text-wrap: pretty; }
.rdesc p.small { font-size: 13px; margin-top: 6px; }
.pgroup .rdesc { margin: 6px 0 8px; }
.sheet h2.squeeze .infodot { width: 24px; height: 24px; margin: -2px -2px -2px 2px; }
.sheet h2.squeeze .infodot svg { width: 19px; height: 19px; }

/* Trends, this week: the plants, colours, fermented days, oily fish and red meat behind the counts */
.trwk { display: grid; gap: 8px; background: var(--bg); border-radius: 12px; padding: 10px 12px 12px; }
.trwk .plantgrid { margin-top: 6px; }
.trwk-h { margin: 2px 0 0; font-size: 13px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.trwk-h span { color: var(--muted); font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; }
.trwk ul { list-style: none; margin: 0; padding: 0; display: grid; }
.trwk-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; line-height: 1.35; }
.trwk li:first-child > .trwk-row, .trwk li.trwk-row:first-child { border-top: 0; }
button.trwk-row { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); color: inherit; font: inherit; font-size: 13.5px; cursor: pointer; border-radius: 0; }
@media (hover: hover) { button.trwk-row:hover > span { text-decoration: underline; text-underline-offset: 2px; } }
.trwk-row .d { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.trwk-row small { color: var(--muted); font-size: 12px; }
.trwk-row.col { grid-template-columns: 12px minmax(0, 1fr); align-items: start; }
.trwk-row .cdot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--surface-2); margin-top: 4px; }
.trwk-row .src { display: block; }
.trwk-row .src + .src { margin-top: 4px; }
.trwk-row.col .src { margin-top: 2px; }
.trwk-row .nw { white-space: nowrap; }
.wt { font-style: normal; font-weight: 700; font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.wt-ok { background: var(--leaf-soft); color: var(--leaf); }
.wt-warn { background: var(--warn-soft); color: var(--warn); }

/* ───────── Train ───────── */
.phasechip { font-family: var(--f-display); font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; padding: 3px 10px 2px; border-radius: 999px; background: var(--surface-2); color: var(--ink); }
.phasechip.p-cut { background: var(--accent-soft); color: var(--accent); }
.phasechip.p-bulk { background: var(--leaf-soft); color: var(--leaf); }
.daypick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; margin-top: 4px; }
.daypick button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 7px 0 6px; display: grid; justify-items: center; gap: 1px; color: var(--muted); min-height: 52px; }
.daypick button span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.daypick button b { font-size: 17px; font-variant-numeric: tabular-nums; color: var(--ink); }
.daypick button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.daypick button[aria-pressed="true"] b { color: var(--bg); }
.daypick button.past { opacity: .55; }
.tvlist { list-style: none; margin: 0; padding: 0; display: grid; }
.tvrow { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; color: inherit; font: inherit; }
.tvlist li:first-child > .tvrow { border-top: 0; }
button.tvrow { cursor: pointer; }
.tvrow .d { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tvrow .n { display: grid; min-width: 0; }
.tvrow .n b { font-size: 15px; }
.tvrow .n small { color: var(--muted); font-size: 12.5px; }
.tvrow > svg { width: 18px; height: 18px; color: var(--muted); }
.tvrow .wt svg { width: 12px; height: 12px; vertical-align: -1px; margin-right: 3px; }
.tvgo { width: 100%; margin-top: 4px; min-height: 50px; font-size: 16px; }
.seg.mini3 button:disabled { opacity: .5; }
.liftlist { list-style: none; margin: 4px 0 0; padding: 0; display: grid; }
.liftrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 9px 0; color: inherit; font: inherit; cursor: pointer; }
.liftlist li:first-child > .liftrow { border-top: 0; }
.liftrow .n { display: grid; min-width: 0; }
.liftrow .n b { font-size: 15px; }
.liftrow .n small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.liftrow .v { display: grid; justify-items: end; font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
.liftrow .v small { font-family: var(--f-body); font-weight: 700; font-size: 11.5px; color: var(--muted); }
.liftrow .v small.up { color: var(--leaf); }
.liftrow .v small.down { color: var(--warn); }
.liftrow .v > small:first-child { display: inline; }
.spark { display: block; }
.spark path { fill: none; stroke: var(--leaf); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.spark circle { fill: var(--leaf); }
.pses { margin-top: 2px; }
.pses > summary span b { font-size: 15px; }
.pexlist { list-style: none; margin: 4px 0 6px; padding: 0; display: grid; }
.pex { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.pex:first-child { border-top: 0; }
.pex .n { display: grid; min-width: 0; }
.pex .n small { color: var(--muted); font-size: 12.5px; }
.vchips { display: flex; flex-wrap: wrap; gap: 6px; }
.vchip { display: inline-flex; gap: 6px; align-items: baseline; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); font-size: 12.5px; font-weight: 700; color: var(--muted); }
.vchip b { color: var(--ink); font-variant-numeric: tabular-nums; }
.vchip.lo { background: var(--warn-soft); color: var(--warn); }
.vchip.lo b { color: var(--warn); }
.why p { font-size: 14px; margin: 8px 0 0; }
.opt.plain { grid-template-columns: minmax(0, 1fr); }
.opt.plain span.d { grid-column: 1; }
.swrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.swrow.off .opt { opacity: .5; }
.seg.mini4 button { font-size: 12.5px; padding: 7px 4px; }
.tscroll { overflow-x: auto; margin-top: 10px; }
.ttable { border-collapse: collapse; width: 100%; font-size: 13px; }
.ttable th, .ttable td { text-align: left; padding: 6px 6px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.ttable th { color: var(--muted); font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.ttable td:first-child { white-space: nowrap; }
body.tvon .scrim { z-index: 80; }
/* the session view */
.tv .pm-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; padding-top: 12px; }
.tvrow.miss .n b { color: var(--muted); }
.tvcard, .tvex { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px 14px; }
.tvcard h3 { margin: 0; font-size: 16px; }
.tvcard .lab { font-size: 13px; font-weight: 700; }
.tvcard textarea { min-height: 60px; font-family: var(--f-body); font-size: 14px; }
.scale10 { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.scale10 button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 0; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink); }
.scale10 button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tvex { border-left: 5px solid var(--leaf); }
.tvex.skip { border-left-color: var(--line); }
.tvex.skip .btn { margin-top: 8px; }
.tvex-top { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.tvname { flex: 1; min-width: 0; font-family: var(--f-display); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .02em; border: 0; border-bottom: 1.5px dashed var(--line); border-radius: 0; background: transparent; color: var(--ink); padding: 2px 0; text-overflow: ellipsis; }
.tvname1 { font-family: var(--f-display); font-weight: 800; font-size: 20px; text-transform: uppercase; }
.tvex .rx { font-family: var(--f-display); font-weight: 800; font-size: 18px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tvhint { margin: 6px 0 0; padding: 6px 10px; border-radius: 10px; background: var(--surface-2); font-size: 13.5px; }
.tvhint.up { background: var(--leaf-soft); }
.tvhint.down { background: var(--warn-soft); }
.tvhow { margin-top: 4px; }
.tvhow > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--accent); }
.tvhow > summary::-webkit-details-marker { display: none; }
.tvhow > summary svg { width: 14px; height: 14px; transition: transform .2s; }
.tvhow[open] > summary svg { transform: rotate(90deg); }
.tvhow p { margin: 4px 0 0; }
.tvex .feel { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
.tvex select, .tvex input { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; color: var(--ink); }
.tvex .feel select { padding: 6px 8px; min-height: 36px; }
.setgrid { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) 60px 44px; gap: 6px; align-items: center; margin-top: 10px; }
.setgrid .h { font-size: 11.5px; font-weight: 700; color: var(--muted); }
.setgrid .sn { font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
.setgrid input, .setgrid select { width: 100%; min-height: 44px; padding: 8px 6px; text-align: center; font-size: 16px; font-variant-numeric: tabular-nums; }
.stick { height: 44px; width: 44px; border-radius: 50%; border: 2px solid var(--leaf); background: transparent; color: var(--leaf); display: grid; place-items: center; }
.stick svg { width: 20px; height: 20px; }
.stick[aria-pressed="true"] { background: var(--leaf); color: var(--surface); }
.tvnote { width: 100%; margin-top: 10px; min-height: 40px; padding: 8px 10px; font-size: 14px; }
.tv .pm-foot { grid-template-columns: auto minmax(0, 1fr); row-gap: 8px; }
.tvrest { grid-column: 1 / -1; display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 6px 6px 6px 10px; }
.tvrest:empty { display: none; }
.tvrest > svg { width: 18px; height: 18px; color: var(--leaf); }
.tvrest b { font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.tvrest span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tvrest .btn.sm { min-height: 34px; padding: 4px 10px; }
@media (max-width: 380px) { .setgrid { grid-template-columns: 22px minmax(0, 1fr) minmax(0, 1fr) 54px 42px; gap: 5px; } .stick { width: 42px; height: 42px; } .tvname { font-size: 18px; } }
body.tvon .toast { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }

/* header steps (fitTop): tighter, then the current section as an icon, then no dots */
.modesw button { flex: none; }
.top.t1 { gap: 2px; padding-left: 12px; padding-right: 8px; }
.top.t1 .iconbtn { width: 34px; }
.top.t1 .modesw { padding: 2px; }
.top.t1 .modesw button { padding-left: 7px; padding-right: 7px; }
.top.t1 .plantpill { padding: 5px 7px; gap: 4px; }
.top.t2 .modesw button[aria-selected="true"] span { display: none; }
.top.t2 .modesw button[aria-selected="true"] svg { display: block; }
.top.t3 .plantpill .pdots { display: none; }
/* nothing may push the page sideways: wide content is fixed where it is, and this stops the page panning if anything slips through */
.app { overflow-x: clip; }
.sheet, .pm-body, .wz-body { overflow-x: hidden; }
/* very narrow screens or very large text: a smaller picture on the recipe sheet, and nothing in its heading can push it wider */
.sheethero .eyebrow { overflow-wrap: anywhere; }
@media (max-width: 359px) { .sheethero { grid-template-columns: 72px minmax(0, 1fr) auto; gap: 10px; } .sheethero > svg:first-child, .sheethero > .art:first-child { width: 72px; height: 72px; } }
.nav-in { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.nav button { min-width: 0; }
.nav button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheethero > div { grid-template-columns: minmax(0, 1fr); }
.nutri div { min-width: 0; padding-inline: 4px; }
.nutri span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 359px) { .nutri span { letter-spacing: 0; } .nutri b { font-size: 21px; } }
.liftrow .n small { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
@media (max-width: 400px) { .liftrow { gap: 8px; } .liftrow .spark { width: 60px; height: 22px; } }
.frow .nm { grid-template-columns: minmax(0, 1fr); overflow-wrap: anywhere; }
.outbody .sum .sl { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rvml .mt { grid-template-columns: minmax(0, 1fr); }
.rvml .mt b { overflow-wrap: anywhere; }
.rvxs { grid-template-columns: minmax(0, 1fr); }
.rvx > span { overflow-wrap: anywhere; }
.mtext .nm, .tvrow .n b, .liftrow .n b { overflow-wrap: anywhere; }
/* training ledger */
.ledger { display: grid; gap: 10px; }
.wsum .minis.ldose { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ldose .mini b { font-size: 28px; }
.lmuss { display: grid; gap: 7px; }
.lmus { display: grid; grid-template-columns: 82px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.lmus .n { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.lmus .bar { position: relative; height: 8px; border-radius: 999px; background: var(--surface-2); }
.lmus .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--warn); }
.lmus.min .bar i { background: var(--leaf); opacity: .55; }
.lmus.eff .bar i { background: var(--leaf); }
.lmus .bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; opacity: .7; }
.lmus .v { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
.lmus .v small { font-weight: 600; color: var(--muted); }
.lexs, .ladds { list-style: none; margin: 0; padding: 0; display: grid; }
.lex { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 8px 0; color: inherit; font: inherit; cursor: pointer; }
.lexs li:first-child .lex { border-top: 0; }
.lex .box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; color: #fff; }
.lex .box svg { width: 15px; height: 15px; }

.shcounts span { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

  .sha-tw, .sha-tw2 { transform-origin: 50% 50%; animation: shtw 2.2s ease-in-out infinite; } .sha-tw2 { animation-delay: 1.1s; }
  .sha-knife { transform-origin: 0% 100%; animation: shwob 3s ease-in-out infinite; }
  .sha-flame { transform-origin: 50% 100%; animation: shflick 1.1s ease-in-out infinite alternate; }
  .sha-clink1 { transform-origin: 100% 100%; animation: shclink1 2.4s ease-in-out infinite; }
  .sha-clink2 { transform-origin: 0% 100%; animation: shclink2 2.4s ease-in-out infinite; }
  .sha-pop2 { transform-origin: 50% 100%; animation: shpop2 2.4s ease-out infinite; }
  .sha-dash { animation: shdash 1s linear infinite; }
  .sha-step { transform-origin: 50% 100%; animation: shstep 1s ease-in-out infinite; }
  .sha-wob { transform-origin: 50% 80%; animation: shwob 2.8s ease-in-out infinite; }
  .sha-zz text { animation: shzz 3s ease-in-out infinite; } .sha-zz text:nth-child(2) { animation-delay: .5s; } .sha-zz text:nth-child(3) { animation-delay: 1s; }

  .sha-tick { stroke-dasharray: 26; animation: shtick .5s both var(--ease); } .sha-tick.t0 { animation-delay: .5s; } .sha-tick.t1 { animation-delay: .75s; } .sha-tick.t2 { animation-delay: 1s; }
  .sha-needle { transform-origin: 0% 100%; animation: shneedle 2.6s ease-in-out infinite; }
  .sha-arrow { animation: sharrow .6s .3s both cubic-bezier(.3, 1.6, .5, 1); }
  .sha-draw { stroke-dasharray: 60; animation: shdraw .7s .6s both var(--ease); }
  .sha-draw2 { transform-origin: 50% 100%; animation: shrise .7s .2s both cubic-bezier(.2, 1.3, .4, 1); }
  .sha-conf > * { animation: shconf 3s ease-in-out infinite; } .sha-conf > :nth-child(2n) { animation-delay: 1s; } .sha-conf > :nth-child(3n) { animation-delay: 2s; }

@keyframes shfill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes shpop { 0% { transform: scale(.4) rotate(-8deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes shstamp { 0% { transform: rotate(-5deg) scale(1.7); opacity: 0; } 100% { transform: rotate(-5deg) scale(1); opacity: 1; } }
@keyframes shup { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shsway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes shswim { 0%, 100% { transform: translateX(-2px) rotate(-1.5deg); } 50% { transform: translateX(2px) rotate(1.5deg); } }
@keyframes shbub { 0% { transform: translateY(6px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-16px); opacity: 0; } }
@keyframes shfall { 0% { transform: translateY(-6px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
@keyframes shtw { 0%, 100% { transform: scale(.7); opacity: .6; } 50% { transform: scale(1.12); opacity: 1; } }
@keyframes shwob { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
@keyframes shflick { from { transform: scaleY(.92) skewX(-2deg); } to { transform: scaleY(1.06) skewX(2deg); } }
@keyframes shclink1 { 0%, 60%, 100% { transform: none; } 75% { transform: rotate(7deg); } }
@keyframes shclink2 { 0%, 60%, 100% { transform: none; } 75% { transform: rotate(-7deg); } }
@keyframes shpop2 { 0%, 70% { transform: scale(.3); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
@keyframes shdash { from { transform: translateX(4px); opacity: .3; } to { transform: translateX(-6px); opacity: 1; } }

/* ───────────── training ─────────────

/* ── the plan ── */

/* ── the slides ── */
function shSlide(sl, i, n) {
  if (sl.type === 'intro') return `<div class="shslide"><div class="eyebrow shgrp">Week of ${fmtRange(RV.st)}</div><h2 class="shname big">How did the week go?</h2>
    <div class="shart">${shArt('intro', 210)}</div><p class="shline">${sl.n ? `${nWord(sl.n, 'goal')} to go through, one at a time.` : 'Nothing logged for this week yet.'}</p><p class="shdet">Tap the right of the screen for the next one, the left to go back.</p></div>`;
  if (sl.type === 'metric') {
    return `<div class="shslide"><div class="eyebrow shgrp">${esc(sl.grp)} · ${sl.idx} of ${sl.of}</div><h2 class="shname">${esc(sl.n)}</h2>
      <div class="shart">${shArt(sl.art, 200)}</div><div class="shstamp" aria-label="Verdict">${shVerdict(sl)}</div>
      <div class="shfig"><b>${esc(sl.fig)}</b><small>${esc(sl.unit)}</small></div><p class="shline">${esc(sl.line)}</p>${sl.detail ? `<p class="shdet">${esc(sl.detail)}</p>` : ''}</div>`;
  }
  if (sl.type === 'score') {
    const rows = SH_GRP.map(g => { const ms = sl.all.filter(m => m.grp === g); return ms.length ? `<div class="shsg"><div class="eyebrow">${g}</div>${ms.map(m => `<div class="rvsr ${m.st === 'none' && !m.info ? 'nil' : ''}">${stDot(m.st)}<span>${esc(m.n)}<span class="sr-only">: ${m.info ? 'for the record' : TR_ST[m.st]}</span></span><b>${esc(m.txt)}</b></div>`).join('')}</div>` : ''; }).join('');
    const tot = sl.ok + sl.mid + sl.off;
    return `<div class="shslide"><div class="eyebrow shgrp">The scorecard</div><h2 class="shname big">${sl.head}</h2>
      <div class="shart sm">${shArt('score', 150)}</div>
      <div class="shcounts"><div class="s-ok"><b>${sl.ok}</b><span>nailed</span></div><div class="s-mid"><b>${sl.mid}</b><span>close</span></div><div class="s-off"><b>${sl.off}</b><span>missed</span></div></div>
      ${tot && sl.best.length ? `<p class="shline">Best of the week: ${esc(joinAnd(sl.best.map(m => m.n.toLowerCase())))}.</p>` : ''}
      <div class="shcard live">${rows}</div></div>`;
  }
  // next week
  const f = sl.focus, nW = ['Nothing to fix', 'One thing to work on', 'Two things to work on', 'Three things to work on'][f.length];
  const bk = `<div class="shbk live"><p class="bkline ${bkDue() ? 'due' : ''}">${ic(bkDue() ? 'warn' : 'check')}${esc(bkLine())}</p><button class="btn sm ${bkDue() ? 'primary' : ''}" data-a="bkshare">Back up now</button></div>`;
  return `<div class="shslide"><div class="eyebrow shgrp">Next week</div><h2 class="shname big">${nW}</h2>
    ${f.length ? `<div class="shfocus live">${f.map(m => `<div class="shfi s-${m.st}">${shArt(m.art, 56)}<div><b>${esc(m.n)}</b><span class="shfs">${esc(m.short)}</span><p>${esc(m.tip)}</p></div></div>`).join('')}</div>`
      : `<div class="shart sm">${shArt('focus', 150)}</div><p class="shline">Every goal with data hit its mark. Same again next week.</p>`}${bk}</div>`;
}
function renderShow(root) {
  if (!RV.slides) RV.slides = shSlides(RV.st);
  const sls = RV.slides, n = sls.length; RV.si = Math.max(0, Math.min(RV.si || 0, n - 1));
  const i = RV.si, sl = sls[i], last = i === n - 1, cls = sl.st === 'none' ? 'info' : sl.st;
  const fin = RV.from === 'auto' || RV.from === 'banner' ? 'Save and check in' : 'Save the week';
  root.innerHTML = `<div class="wz rv rvshow s-${cls}" role="dialog" aria-modal="true" aria-label="Week review" ${RV.fresh ? '' : 'style="animation:none"'}>
    <div class="shtop"><div class="shprog" style="grid-template-columns:repeat(${n},1fr)">${sls.map((_, j) => `<i class="${j < i ? 'done' : j === i ? 'on' : ''}"></i>`).join('')}</div>
      <div class="shbar"><span class="small">${fmtRange(RV.st)} · ${i + 1} of ${n}</span>${i < n - 2 ? '<button class="btn sm ghost" data-a="shskip">Skip</button>' : ''}<button class="iconbtn" data-a="rvclose" aria-label="Close review">${ic('x')}</button></div></div>
    <div class="shbody ${RV.anim ? (RV.dir > 0 ? 'in-r' : 'in-l') : ''}" id="rv-body" aria-live="polite">${shSlide(sl, i, n)}</div>
    <div class="wz-foot"><button class="btn" data-a="rvback">Back</button><button class="btn primary" data-a="rvnext">${last ? fin : 'Next'}</button></div></div>`;
  // tap the right of a slide for the next one, the left to go back; swipe works too
  const body = $('rv-body');
  body.addEventListener('click', e => { if (e.target.closest('button, a, input, summary, details, .live')) return; const r = body.getBoundingClientRect(); if (e.clientX - r.left < r.width * 0.3) ACT.rvback(); else ACT.rvnext(); });
  let x0 = null, y0 = null;
  body.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive: true });
  body.addEventListener('touchend', e => { if (x0 === null) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { e.preventDefault(); if (dx < 0) ACT.rvnext(); else ACT.rvback(); } });
}
const shOn = () => !!RV && rvSteps(RV.st)[RV.step] === 'sum';
document.addEventListener('keydown', e => {
  if (!shOn() || SH || e.target.closest && e.target.closest('input, textarea, select')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); ACT.rvnext(); } else if (e.key === 'ArrowLeft') { e.preventDefault(); ACT.rvback(); }
});

/* ── wrapping up: a card at the bottom of the week's last day, once it comes ── */
function wrapCard(st) {
  const lastD = addDays(st, 6), tk = todayKey();
  if (lastD > tk || st < rvFirst() || !rvHasData(st)) return '';
  const done = S.rev[st];
  return `<section class="wsum wrapcard ${done ? 'done' : ''}">${shArt(done ? 'score' : 'intro', 60)}<div class="wrapt"><div class="eyebrow">${lastD === tk ? 'Today' : DOWL[dayIndex(lastD)]} · end of the week</div><b>${done ? 'Week wrapped up' : 'Wrap up the week'}</b>
    <span class="small muted">${done ? `Reviewed ${done === tk ? 'today' : `on ${fmtDay(done)}`}. The slides are there to see again.` : 'Confirm what you ate, drank and did, then see how it went, goal by goal.'}</span></div>
    <button class="btn sm ${done ? '' : 'primary'}" data-a="wrapup" data-v="${st}">${done ? 'See the slides' : 'Wrap up'}</button></section>`;
}
Object.assign(ACT, {
  wrapup(d) { const st = d.v; if (!DAY_KEY.test(st || '')) return; openReview(st, 'wrap', S.rev[st] ? 'sum' : undefined); },
  shskip() { if (!shOn() || !RV.slides) return; RV.si = RV.slides.length - 2; RV.anim = true; RV.dir = 1; renderRV(); }
});

/* ───────────── recipe ideas ─────────────
   What you've got in, turned into a meal. The app's own recipes that use the most of it come first; when none fits
   well, one is built from a dish template around those ingredients, sized to the slot and to what the day still needs
   in protein and fibre. Saved ideas work like any recipe, but the planner never picks them by itself. */
const IDEA_PROT = ['chicken', 'thigh', 'turkeymince', 'chickenmince', 'beefmince', 'porkmince', 'steak', 'salmon', 'mackerel', 'smokedmack', 'trout', 'bream', 'cod', 'prawns', 'tuna', 'sardines', 'tofu', 'tempeh', 'egg', 'halloumi', 'chickpeas', 'butterbeans', 'cannellini', 'blackbeans', 'kidneybeans', 'puy', 'redlentils', 'edamame'];
const IDEA_RAW = ['chicken', 'thigh', 'turkeymince', 'chickenmince', 'beefmince', 'porkmince', 'steak', 'salmon', 'mackerel', 'trout', 'bream', 'cod', 'prawns'];
const IDEA_CARB = ['brownrice', 'basmati', 'quinoa', 'bulgur', 'barley', 'spelt', 'couscous', 'orzo', 'pasta', 'wwpasta', 'lentilpasta', 'chickpeapasta', 'soba', 'wwnoodles', 'ricenoodles', 'potato', 'sweetpotato', 'gnocchi', 'grainpouch', 'sourdough', 'rye', 'pitta', 'wrap', 'oats'];
const IDEA_FRUIT = ['apple', 'pear', 'banana', 'blueberries', 'raspberries', 'strawberries', 'kiwi', 'orange', 'clementine', 'pomegranate', 'mango', 'plum', 'rhubarb', 'berrymix', 'strawblue', 'frozmango', 'frozcherry', 'frozpeach', 'dates', 'apricots'];
const IDEA_HERB = ['basil', 'parsley', 'coriander', 'mint', 'dill', 'chives', 'rosemary', 'thyme'];
const IDEA_AROMA = ['onion', 'redonion', 'springonion', 'garlic', 'ginger', 'chilli', 'leek', 'celery', 'lemon', 'lime'];
const IDEA_DAIRY = ['fage0', 'skyr', 'liveyog', 'kefir', 'quark', 'cottage', 'feta', 'parmesan', 'mozz', 'cheddar', 'ricotta', 'cremef', 'milk', 'oatmilk'];
const IDEA_LEAF = ['spinach', 'kale', 'rocket', 'watercress', 'lettuce', 'pakchoi'];
const IDEA_FROZVEG = ['peas', 'broadbeans', 'sweetcorn', 'stirfrymix', 'ttdgreens'];
const ideaRole = id => (IDEA_PROT.includes(id) ? 'prot' : IDEA_CARB.includes(id) ? 'carb' : IDEA_FRUIT.includes(id) ? 'fruit' : IDEA_HERB.includes(id) ? 'herb' : IDEA_AROMA.includes(id) ? 'aroma' : IDEA_DAIRY.includes(id) ? 'dairy'
  : ING[id] && (ING[id].a === 'veg' || IDEA_FROZVEG.includes(id)) ? 'veg' : 'extra');
// a portion's worth of each, before the whole dish is sized to the slot
function ideaG(id, tpl) {
  const g = ING[id], role = ideaRole(id);
  if (id === 'egg') return tpl === 'scramble' ? 150 : 100;
  if (role === 'prot') return ({ tofu: 150, tempeh: 100, edamame: 80, halloumi: 60, redlentils: 60, puy: 125, tuna: 110, sardines: 90, prawns: 120, smokedmack: 75 })[id] || (['chickpeas', 'butterbeans', 'cannellini', 'blackbeans', 'kidneybeans'].includes(id) ? 120 : 140);
  if (role === 'carb') return ({ potato: 250, sweetpotato: 250, gnocchi: 150, grainpouch: 125, oats: 50, sourdough: 40, rye: 35, pitta: 60, wrap: 62 })[id] || 70;
  if (role === 'fruit') return g.u && g.uw >= 40 ? g.uw : ({ dates: 20, apricots: 20, pomegranate: 40 })[id] || 80;

Object.assign(ACT, {

/* one-off repair (3.9.1). In the week of 12 Oct a night out went from 2 to 3½ pints by being taken off and put back,
   which moved its drinks off the days already eaten. Those days get back the 2 pints spread over the week that they
   had; the extra 1½ comes off from the day it was changed. Meals ticked since at the moved size go back to the size
   they were planned at; logged food, packed boxes and anything else stay as they are. Runs once. */
function repairDrinks() {

  if (tk < st || tk > addDays(st, 13)) return '';
  (S.fix = S.fix || {}).d1018 = 1;
  const pints = o => Object.entries(o.drinks || {}).reduce((a, [id, n]) => a + (DR[id] && DR[id].step === 0.5 ? n : 0), 0);
  const cand = days.filter(k => { const o = outOf(S.days[k]); return o && Math.abs(pints(o) - 3.5) < 0.01 && DAY_KEY.test(o.from || '') && o.from > addDays(st, 2) && setAt(k).drinkMode === 'spread'; });
  if (cand.length !== 1) { save(); return ''; }

  const before = {}; back.forEach(k => { before[k] = plannedM(k); });
  back.forEach(k => { const d = S.days[k]; d.dfx = d.dfx || {}; d.dfx[nk] = Math.round(per * 10) / 10; }); NSC = {};
  let fixed = 0;
  back.forEach(k => { const d = S.days[k], after = plannedM(k); SLOTS.forEach(s => { const dn = d.done[s]; if (!isObj(dn) || !(dn.m > 0) || before[k][s] === undefined || after[s] === undefined || d.pk && d.pk[s]) return; if (Math.abs(dn.m - before[k][s]) < 0.004 && Math.abs(after[s] - dn.m) >= 0.004) { dn.m = +after[s].toFixed(3); fixed++; } }); });

}
(function init() {
